# Deploys redirect stubs to GitHub Pages: the manual, demo and legal pages moved to https://lumamatters.lumalux.at/.
# Runs on every push to main (Pages Source = "GitHub Actions") and by hand.
name: Deploy redirect stubs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync
      - run: node scripts/make-redirects.mjs redirects-dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: redirects-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
